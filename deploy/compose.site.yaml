# Official-site deployment only. Generate the accepted setup kit first:
# python3 scripts/package-self-host.py --output .deployment/public-setup
# bash scripts/compose.sh -f deploy/compose.site.yaml up -d --force-recreate --wait
# Paths are resolved relative to the first Compose file (the repository root).
services:
  controller:
    volumes:
      - type: bind
        source: ./.deployment/public-setup
        target: /app/web/self-host-downloads
        read_only: true
        bind:
          create_host_path: false
