name: ${AGENT_PROJECT:-agentic-browser-agent}
services:
  volumes-init:
    image: ${AGENT_IMAGE:?Set the release image}
    user: '0:0'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    entrypoint: [node, -e]
    command:
      - "const fs=require('fs'); for(const p of ['/state/browser','/state/uploads','/state/images','/state/logs']) { fs.chownSync(p,Number(process.env.RUN_UID),Number(process.env.RUN_GID)); fs.chmodSync(p,0o700); }"
    environment:
      RUN_UID: ${AGENT_UID:-1000}
      RUN_GID: ${AGENT_GID:-1000}
    volumes:
      - {type: volume, source: browser-data, target: /state/browser, volume: {nocopy: true}}
      - {type: volume, source: uploads, target: /state/uploads, volume: {nocopy: true}}
      - {type: volume, source: images, target: /state/images, volume: {nocopy: true}}
      - {type: volume, source: logs, target: /state/logs, volume: {nocopy: true}}
  gateway:
    image: ${GATEWAY_IMAGE:?Set the pinned gateway image}
    user: '${AGENT_UID:-1000}:${AGENT_GID:-1000}'
    entrypoint: [nginx, -g, 'daemon off;']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['${AGENT_BIND:-127.0.0.1}:${AGENT_PORT:-3333}:8080']
    volumes: ['./config/nginx.conf:/etc/nginx/nginx.conf:ro', './state/maintenance:/maintenance:ro']
    tmpfs: ['/tmp:rw,nosuid,nodev,size=32m,mode=1777']
    networks: [front]
    depends_on:
      agent: {condition: service_healthy}
      browser: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
  agent:
    image: ${AGENT_IMAGE:?Set the release image}
    user: '${AGENT_UID:-1000}:${AGENT_GID:-1000}'
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./config:/config:ro
      - {type: volume, source: uploads, target: /app/uploads, volume: {nocopy: true}}
      - {type: volume, source: images, target: /app/client/public/images, volume: {nocopy: true}}
      - {type: volume, source: logs, target: /app/logs, volume: {nocopy: true}}
    secrets: [agent, browser_token]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=128m,mode=1777']
    networks: [front, database]
    depends_on:
      volumes-init: {condition: service_completed_successfully}
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      browser: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3080/api/config',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    stop_grace_period: 90s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
  browser:
    image: ${BROWSER_IMAGE:?Set the release image}
    user: '${AGENT_UID:-1000}:${AGENT_GID:-1000}'
    group_add: ['${DOCKER_GID:?Set Docker socket group}']
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BROWSER_SERVICE_TOKEN_FILE: /run/secrets/browser_token
      BROWSER_CONTROL_HOST: 0.0.0.0
      BROWSER_DATA_HOST: 0.0.0.0
      BROWSER_DATA_DIR: /data
      BROWSER_DATA_VOLUME: ${AGENT_PROJECT:-agentic-browser-agent}-browser
      BROWSER_RUNTIME_IMAGE: ${RUNTIME_IMAGE:?Set the pinned runtime image}
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-1}
      DOMAIN_CLIENT: ${AGENT_ORIGIN:-http://127.0.0.1:3333}
    secrets: [browser_token]
    volumes:
      - {type: volume, source: browser-data, target: /data, volume: {nocopy: true}}
      - type: bind
        source: ${DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind: {create_host_path: false}
    tmpfs: ['/tmp:rw,nosuid,nodev,size=64m,mode=1777']
    networks: [front]
    depends_on:
      volumes-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "Promise.all([8081,8082].map(p=>fetch('http://127.0.0.1:'+p+'/health',{signal:AbortSignal.timeout(3000)}))).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    stop_grace_period: 90s
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
  mongo:
    image: mongo:8.0@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    volumes: [mongo-data:/data/db]
    networks: [database]
    restart: unless-stopped
    command: [mongod, --wiredTigerCacheSizeGB, '0.25']
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'db.adminCommand({ping:1}).ok']
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    networks: [database]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
networks:
  front: {}
  database: {internal: true}
volumes:
  browser-data: {name: '${AGENT_PROJECT:-agentic-browser-agent}-browser'}
  mongo-data: {}
  redis-data: {}
  uploads: {}
  images: {}
  logs: {}
secrets:
  agent: {file: ./config/secrets.env}
  browser_token: {file: ./config/browser-token}
