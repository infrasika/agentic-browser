# Hosted Agent site: /etc/nginx/conf.d/agentic-browser.conf.
# This matches the current Cloudflare HTTPS -> host Nginx HTTP topology.
# It does not add TLS to the Cloudflare-to-origin connection.
# Install in the http {} context. See README.md for rollout and rollback.

map $http_upgrade $ab_demo_connection_upgrade {
    default upgrade;
    '' close;
}

upstream ab_demo_chat {
    server 127.0.0.1:3080;
}

upstream ab_demo_viewer {
    # Data-only listener; private control API is on 127.0.0.1:8081.
    server 127.0.0.1:8082;
}

server {
    listen 80;
    server_name agentic-browser.zkpass.org;

    # Preserve the existing site's trusted Cloudflare proxy configuration.
    # Recheck these ranges against https://www.cloudflare.com/ips/ at rollout.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    client_max_body_size 10m;
    client_body_timeout 15s;
    access_log off;

    # Inherited by both proxy locations. Do not replace this header set in a
    # child location without also preserving the identity-header stripping.
    proxy_http_version 1.1;
    proxy_set_header Host agentic-browser.zkpass.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host agentic-browser.zkpass.org;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded '';
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $ab_demo_connection_upgrade;
    # The authenticated LibreChat backend creates these; visitors cannot.
    proxy_set_header X-User-ID '';
    proxy_set_header X-Tenant-ID '';
    proxy_set_header X-Conversation-ID '';
    proxy_set_header X-Task-ID '';
    proxy_set_header X-Actor '';
    proxy_set_header X-Agent-Run-ID '';
    proxy_set_header X-Service-Key '';
    # Keep Authorization and Cookie: LibreChat needs its normal user auth.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Never retry a chat submission or browser mutation on another upstream.
    proxy_next_upstream off;

    # No public route reaches MCP, even with a valid service credential.
    location = /mcp { return 404; }
    location ^~ /mcp/ { return 404; }
    location = /api/mcp { return 404; }
    location ^~ /api/mcp/ { return 404; }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /browser/mcp { return 404; }
    location ^~ /browser/mcp/ { return 404; }
    location = /browser/internal { return 404; }
    location ^~ /browser/internal/ { return 404; }

    # Anonymous browser and direct human-control endpoints are not exposed.
    location = /connect { return 404; }
    location = /view { return 404; }
    location ^~ /api/public/ { return 404; }
    location ^~ /api/demo/ { return 404; }
    location ^~ /api/human/ { return 404; }

    location = /browser/v1/observe {
        proxy_pass http://ab_demo_viewer;
    }
    location = /browser/v1/input {
        proxy_pass http://ab_demo_viewer;
    }
    location = /browser { return 404; }
    location ^~ /browser/ { return 404; }

    location / {
        # Created only by the idle backup job; no reload is needed per backup.
        if (-f /run/librechat-backup/maintenance) { return 503; }
        # Includes LibreChat OAuth callbacks, chat APIs, SSE and static assets.
        proxy_pass http://ab_demo_chat;
    }

    error_page 503 @ab_demo_maintenance;
    location @ab_demo_maintenance {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header X-Browser-Demo-Maintenance "1" always;
        return 503 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser Demo</title><body><h1>We will be back shortly</h1><p>Browser Demo is undergoing brief maintenance. Please try again in a minute.</p></body></html>';
    }
}
