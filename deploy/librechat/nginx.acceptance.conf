# Isolated test proxy. Start with a private -p prefix; never reload the system nginx.
pid nginx.pid;
error_log error.log;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path body;
    proxy_temp_path proxy;
    map $http_upgrade $browser_test_upgrade { default upgrade; '' close; }
    server {
        listen 127.0.0.1:3081;
        server_name 127.0.0.1;
        client_max_body_size 10m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-User-ID '';
        proxy_set_header X-Tenant-ID '';
        proxy_set_header X-Conversation-ID '';
        proxy_set_header X-Task-ID '';
        proxy_set_header X-Actor '';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $browser_test_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_next_upstream off;
        location = /mcp { return 404; }
        location ^~ /mcp/ { return 404; }
        location = /api/mcp { return 404; }
        location ^~ /api/mcp/ { return 404; }
        location = /internal { return 404; }
        location ^~ /internal/ { return 404; }
        location = /browser/v1/observe { proxy_pass http://127.0.0.1:18082; }
        location = /browser/v1/input { proxy_pass http://127.0.0.1:18082; }
        location ^~ /browser/ { return 404; }
        location / { proxy_pass http://127.0.0.1:3091; }
    }
}
