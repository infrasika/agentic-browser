# Install under nginx's http {} context (e.g. sites-available on Ubuntu).
# Replace demo.example.com and certificate paths before nginx -t/reload.
map $http_upgrade $agentic_connection_upgrade {
    default upgrade;
    '' close;
}
# noVNC loads many ES modules at once. They must not exhaust the API budget
# during initial connection or reload. Empty keys are not rate-accounted.
map $uri $agentic_request_key {
    default $binary_remote_addr;
    ~^/vendor/novnc/ "";
}
limit_req_zone $agentic_request_key zone=agentic_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=agentic_connections:10m;

server {
    listen 80;
    server_name demo.example.com;
    return 308 https://demo.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name demo.example.com;
    ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    client_body_timeout 15s;
    limit_req zone=agentic_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn agentic_connections 24;
    # Session keys are in POST bodies, human tickets in URL fragments. Do not
    # enable request-body/Authorization/cookie logging at this or any upstream.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3334;
        proxy_http_version 1.1;
        proxy_set_header Host demo.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agentic_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
