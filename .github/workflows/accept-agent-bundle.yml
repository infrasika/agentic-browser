name: Verify complete Agent candidate on a fresh runner
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Native Linux architecture; must match all six images in the bundle'
        type: choice
        options: [amd64, arm64]
        default: amd64
        required: true
      bundle_url:
        description: 'Trusted HTTPS URL for a complete offline Agent candidate archive'
        required: true
      sha256:
        description: 'SHA-256 from the trusted release channel (64 lowercase hex characters)'
        required: true
permissions: {}
concurrency:
  group: complete-agent-candidate-acceptance-${{ inputs.architecture }}
  cancel-in-progress: false
jobs:
  install:
    name: Native Linux / ${{ inputs.architecture }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    env:
      CANDIDATE_URL: ${{ inputs.bundle_url }}
      CANDIDATE_SHA256: ${{ inputs.sha256 }}
      CANDIDATE_ARCH: ${{ inputs.architecture }}
    steps:
      # No source checkout, npm install or image build. The bundle contains its tools.
      - name: Install the shared Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download and verify the exact candidate
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import { execFileSync } from 'node:child_process';
          const arch = process.env.CANDIDATE_ARCH;
          assert(['amd64', 'arm64'].includes(arch), 'unsupported architecture');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, arch === 'amd64' ? 'x64' : 'arm64', 'native Node architecture mismatch');
          assert.equal(os.machine(), arch === 'amd64' ? 'x86_64' : 'aarch64', 'native host architecture mismatch');
          const docker = JSON.parse(execFileSync('docker', ['info', '--format', '{{json .}}'], { encoding: 'utf8' }));
          assert.equal(docker.OSType, 'linux');
          const dockerArch = { amd64: 'amd64', x86_64: 'amd64', arm64: 'arm64', aarch64: 'arm64' }[docker.Architecture];
          assert.equal(dockerArch, arch, 'native Docker architecture mismatch');
          const url = new URL(process.env.CANDIDATE_URL);
          assert(url.protocol === 'https:' && url.hostname && !url.username && !url.password);
          assert(/^[a-f0-9]{64}$/.test(process.env.CANDIDATE_SHA256));
          fs.writeFileSync('host-evidence.json', JSON.stringify({
            host: process.env.GITHUB_ACTIONS === 'true' ? 'GitHub-hosted fresh job' : 'local workflow rehearsal', runnerOS: process.env.RUNNER_OS,
            runnerArch: process.env.RUNNER_ARCH, runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT, machine: os.machine(),
            expectedPlatform: 'linux/' + arch, dockerArchitecture: docker.Architecture,
            sourceCheckout: false, npmDependencyInstall: false,
            node: process.version, archiveSha256: process.env.CANDIDATE_SHA256,
          }, null, 2) + '\n');
          NODE
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 "$CANDIDATE_URL" -o candidate.tar.gz
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const hash = createHash('sha256');
          for await (const chunk of fs.createReadStream('candidate.tar.gz')) hash.update(chunk);
          assert.equal(hash.digest('hex'), process.env.CANDIDATE_SHA256, 'archive checksum mismatch');
          // GNU tar's escaped verbose listing rejects all links/special entries,
          // unsafe names, duplicate paths and oversized payloads before extraction.
          const env = { ...process.env, LC_ALL: 'C', TZ: 'UTC' };
          const listing = execFileSync('tar', ['--list', '--verbose', '--gzip', '--numeric-owner', '--quoting-style=escape', '--file', 'candidate.tar.gz'], { env, encoding: 'utf8', maxBuffer: 1024 * 1024 });
          const roots = new Set(), names = new Set(); let bytes = 0;
          for (const line of listing.trimEnd().split('\n')) {
            const item = /^([-d])[rwxStTs-]{9}\s+\d+\/\d+\s+(\d+)\s+\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}\s+([A-Za-z0-9_./-]+)$/.exec(line);
            assert(item, 'invalid archive member');
            const name = item[3].replace(/\/$/, '');
            const parts = name.split('/');
            assert(parts.every(part => part && part !== '.' && part !== '..'));
            assert(!names.has(name), 'duplicate archive path');
            names.add(name); roots.add(parts[0]); bytes += Number(item[2]);
          }
          assert.equal(roots.size, 1); assert(bytes < 12 * 1024 ** 3);
          fs.mkdirSync('extracted', { mode: 0o700 });
          execFileSync('tar', ['--extract', '--gzip', '--file', 'candidate.tar.gz', '--directory', 'extracted', '--no-same-owner', '--no-same-permissions'], { env });
          fs.renameSync('extracted/' + [...roots][0], 'candidate');
          NODE
          node candidate/bundle.mjs verify
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const build = JSON.parse(fs.readFileSync('candidate/BUILD.json', 'utf8'));
          assert.equal(build.distribution, 'offline-candidate', 'complete offline bundle required');
          assert.equal(Object.keys(build.images).length, 6);
          for (const image of Object.values(build.images)) {
            assert.equal(image.platform, 'linux/' + process.env.CANDIDATE_ARCH, 'candidate architecture mismatch');
          }
          NODE
      - name: Import fixed images and verify with bundled Node tools
        run: |
          node candidate/bundle.mjs load-images
          mkdir host-tools
          ln -s "$(command -v node)" host-tools/node
          ln -s "$(command -v docker)" host-tools/docker
          ln -s "$(command -v flock)" host-tools/flock
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('node', ['candidate/acceptance/verify.mjs', '--work', path.resolve('acceptance')], {
            env: { ...process.env, PATH: path.resolve('host-tools') }, stdio: 'inherit',
          });
          process.exitCode = result.status ?? 1;
          NODE
      - name: Preserve only non-secret acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-agent-candidate-acceptance-${{ inputs.architecture }}
          path: |
            host-evidence.json
            acceptance/report.json
            candidate/BUILD.json
            candidate/release.json
          if-no-files-found: warn
          retention-days: 30
