name: Publish Agent prerelease
run-name: Publish ${{ inputs.version }} from ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New immutable prerelease version (vX.Y.Z-rc.N or vX.Y.Z-preview.N)'
        required: true
        type: string
      build_run_id:
        description: 'Optional earlier run ID whose immutable build artifacts should be reused after a tooling-only repair'
        required: false
        type: string

permissions:
  contents: read
  actions: read
concurrency:
  group: agent-ghcr-publication
  cancel-in-progress: false
env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Validate release branch and version
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Releases must run from main. Merge the changes into main before publishing.'
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(rc|preview)\.[0-9]+$ ]]; then
            echo '::error::Use a vX.Y.Z-rc.N or vX.Y.Z-preview.N prerelease version.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match the committed package version
        run: |
          expected="v$(jq -r .version package.json)"
          if [[ "$RELEASE_VERSION" != "$expected" ]]; then
            echo "::error::Requested version must match package.json ($expected)."
            exit 1
          fi
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    if: ${{ !inputs.build_run_id }}
    name: Build / ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - name: Authenticate the ephemeral runner to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build committed source and stage architecture tags
        run: node scripts/build/release-ci.mjs stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.arch }}
          path: handoff/
          if-no-files-found: error
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diagnostics-${{ matrix.arch }}
          path: |
            output/build/*/*/*.log
            output/build/*/*/report.json
          retention-days: 7
      - if: always()
        run: docker logout ghcr.io
  merge:
    needs: [checks, build]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.build_run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/release-setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: artifacts
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Authenticate the ephemeral runner to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Verify source identities and publish immutable dual-platform indices
        run: node scripts/build/release-ci.mjs merge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication
          path: publication/
          if-no-files-found: error
      - if: always()
        run: docker logout ghcr.io
  acceptance:
    needs: merge
    if: ${{ !cancelled() && needs.merge.result == 'success' }}
    name: Install and verify / ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/release-setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.arch }}
          path: artifacts/build-${{ matrix.arch }}
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication
          path: publication
      - name: Pull anonymously and verify Docker-only deployment on native Linux
        run: node scripts/build/release-ci.mjs package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-${{ matrix.arch }}
          path: delivery/
          if-no-files-found: error
      - name: Preserve non-secret failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-failure-${{ matrix.arch }}
          path: delivery/*.json
          retention-days: 7
  release:
    needs: acceptance
    if: ${{ !cancelled() && needs.acceptance.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: delivery-*
          merge-multiple: true
          path: delivery
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication
          path: publication
      - name: Verify evidence and checksum every asset
        run: node scripts/build/release-ci.mjs collect
      - name: Publish the verified prerelease with a new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_VERSION" delivery/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Agentic Browser $RELEASE_VERSION" --notes-file release-notes.md \
            --prerelease --latest=false
