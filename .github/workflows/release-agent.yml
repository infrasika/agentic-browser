name: Publish Agent preview
run-name: Publish ${{ inputs.version }} from ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New immutable preview version (vX.Y.Z-preview.N)'
        required: true
        type: string
      build_run_id:
        description: 'Optional earlier run ID whose immutable build artifacts should be reused after a tooling-only repair'
        required: false
        type: string

permissions:
  contents: read
  actions: read
concurrency:
  group: agent-ghcr-publication
  cancel-in-progress: false
env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    if: ${{ !inputs.build_run_id }}
    name: Build / ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - name: Authenticate the ephemeral runner to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build committed source and stage architecture tags
        run: node scripts/build/release-ci.mjs stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.arch }}
          path: handoff/
          if-no-files-found: error
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics-${{ matrix.arch }}
          path: |
            output/build/*/*/*.log
            output/build/*/*/report.json
          retention-days: 7
      - if: always()
        run: docker logout ghcr.io
  merge:
    needs: [checks, build]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.build_run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/release-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-*
          path: artifacts
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Authenticate the ephemeral runner to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Verify source identities and publish immutable dual-platform indices
        run: node scripts/build/release-ci.mjs merge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication
          path: publication/
          if-no-files-found: error
      - if: always()
        run: docker logout ghcr.io
  acceptance:
    needs: merge
    if: ${{ !cancelled() && needs.merge.result == 'success' }}
    name: Install and verify / ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/release-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-${{ matrix.arch }}
          path: artifacts/build-${{ matrix.arch }}
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication
          path: publication
      - name: Pull anonymously, package and verify the delivered archive on native Linux
        run: node scripts/build/release-ci.mjs package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-${{ matrix.arch }}
          path: delivery/
          if-no-files-found: error
      - name: Preserve non-secret failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-failure-${{ matrix.arch }}
          path: delivery/*.json
          retention-days: 7
  release:
    needs: acceptance
    if: ${{ !cancelled() && needs.acceptance.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: delivery-*
          merge-multiple: true
          path: delivery
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication
          path: publication
      - name: Verify evidence and checksum every asset
        run: node scripts/build/release-ci.mjs collect
      - name: Publish the verified preview with a new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_VERSION" delivery/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Agentic Browser $RELEASE_VERSION" --notes-file release-notes.md \
            --prerelease --latest=false
