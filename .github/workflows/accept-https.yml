name: Verify published HTTPS deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: https-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  https:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.22.1
      - name: Prepare external verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx libnss3-tools openssl
          npm ci
          npm run check
          npx playwright install --with-deps chromium
      - name: Verify HTTPS MCP, native handoff and installation lifecycle
        env:
          AB_ACCEPTANCE_FRESH_RUNNER: '1'
        run: npm run test:https
      - name: Preserve sanitized acceptance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: https-${{ matrix.arch }}
          path: output/https/**/report.json
          if-no-files-found: error
          retention-days: 30
