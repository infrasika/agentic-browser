name: Verify published upgrade and rollback
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upgrade-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.22.1
      - name: Prepare external verifier
        run: |
          npm ci
          npm run check
          bash -n scripts/workspace-backup.sh
      - name: Verify anonymous published-image upgrade and fresh-volume rollback
        run: npm run test:upgrade
      - name: Preserve non-sensitive acceptance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-${{ matrix.arch }}
          path: output/upgrade/**/report.json
          if-no-files-found: error
          retention-days: 30
