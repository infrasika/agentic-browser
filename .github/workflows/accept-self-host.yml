name: Verify published self-host installation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: self-host-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.16.0
      - name: Prepare external test client
        run: |
          npm ci
          npm run check
          npx playwright install --with-deps chromium
      # No Docker build, image cache restore, or registry login. The source
      # checkout supplies only the verifier; the installation receives two files.
      - name: Install public images and verify the complete handoff
        env:
          AB_ACCEPTANCE_FRESH_RUNNER: '1'
        run: npm run test:self-host
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-host-${{ matrix.arch }}
          path: output/self-host/**/report.json
          if-no-files-found: error
          retention-days: 30
