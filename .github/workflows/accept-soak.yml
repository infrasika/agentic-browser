name: Verify sustained browser reliability
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minimum total active minutes, split between public and authenticated modes (1-120)'
        default: '120'
        required: true
permissions:
  contents: read
concurrency:
  group: soak-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.16.0
      - name: Prepare external verifier
        run: |
          npm ci
          npm run check
      - name: Exercise published images on a disposable installation
        env:
          AB_RELIABILITY_SOAK_MINUTES: ${{ inputs.minutes }}
        run: npm run test:soak
      - name: Preserve non-sensitive acceptance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soak-${{ matrix.arch }}
          path: output/reliability/**/report.json
          if-no-files-found: error
          retention-days: 30
