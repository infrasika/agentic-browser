name: Publish verified browser images
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New unused immutable version, e.g. v0.1.0-preview.3'
        required: true
permissions:
  contents: read
concurrency:
  group: image-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_ARCH: ${{ matrix.arch }}
      AB_CONTROLLER_IMAGE: ghcr.io/infrasika/agentic-browser-controller:build-${{ github.sha }}-${{ matrix.arch }}
      AB_RUNTIME_IMAGE: ghcr.io/infrasika/agentic-browser-runtime:build-${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate release identity
        run: |
          python3 - <<'PY'
          import os,re
          assert os.environ['GITHUB_REPOSITORY']=='infrasika/agentic-browser'
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.-]+)?',os.environ['RELEASE_VERSION'])
          PY
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.16.0
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/runtime/packages
          key: browser-assets-${{ matrix.arch }}-${{ hashFiles('runtime/assets.lock.json') }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker
      - name: Install and check source
        run: |
          npm ci
          npm run check
          npm test
          python3 scripts/fetch-runtime-assets.py --arch "$RELEASE_ARCH"
          npx playwright install --with-deps chromium
      - name: Build native images
        run: |
          docker buildx build --load --provenance=false --platform "linux/$RELEASE_ARCH" -f runtime/controller.Dockerfile --build-arg "AB_VERSION=$RELEASE_VERSION" --build-arg "AB_REVISION=$GITHUB_SHA" -t "$AB_CONTROLLER_IMAGE" .
          docker buildx build --load --provenance=false --platform "linux/$RELEASE_ARCH" -f runtime/Dockerfile --build-arg "AB_VERSION=$RELEASE_VERSION" --build-arg "AB_REVISION=$GITHUB_SHA" -t "$AB_RUNTIME_IMAGE" .
      - name: Verify extensions, sandbox, isolation and handoff
        run: |
          AGENTIC_TEST_IMAGE="$AB_RUNTIME_IMAGE" npm run test:extensions
          npm run test:controller
          npm run test:public-mcp
      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified architecture images
        run: |
          docker push "$AB_CONTROLLER_IMAGE"
          docker push "$AB_RUNTIME_IMAGE"
          python3 scripts/release-manifest.py record "$RELEASE_ARCH" output/image-digests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digests-${{ matrix.arch }}
          path: output/image-digests/*.json
          if-no-files-found: error
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.arch }}
          path: |
            output/runtime/*.log
            output/runtime/screenshots/
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digests-*
          path: output/image-digests
          merge-multiple: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform indexes and deployment bundle
        run: python3 scripts/release-manifest.py publish "$RELEASE_VERSION" output/image-digests
      - name: Create versioned release
        run: |
          gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" --prerelease --title "Agentic Browser $RELEASE_VERSION" --notes-file output/release/NOTES.md output/release/agentic-browser-deploy.tar.gz output/release/SHA256SUMS output/release/RELEASE.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-${{ inputs.version }}
          path: output/release/
          if-no-files-found: error
