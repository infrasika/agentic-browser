name: Agent release tools
description: Prepare locked Node dependencies and the disposable runner's system Docker daemon
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
    - run: npm ci --no-audit --no-fund
      shell: bash
    - name: Enable multi-platform storage on this disposable runner
      shell: bash
      run: |
        test "$RUNNER_ENVIRONMENT" = github-hosted
        sudo mkdir -p /etc/docker
        if sudo test -f /etc/docker/daemon.json; then
          sudo cat /etc/docker/daemon.json > "$RUNNER_TEMP/docker-existing.json"
        else
          echo '{}' > "$RUNNER_TEMP/docker-existing.json"
        fi
        jq '.features["containerd-snapshotter"] = true' "$RUNNER_TEMP/docker-existing.json" > "$RUNNER_TEMP/docker-release.json"
        sudo install -m 644 "$RUNNER_TEMP/docker-release.json" /etc/docker/daemon.json
        sudo systemctl restart docker
        echo 'DOCKER_HOST=unix:///var/run/docker.sock' >> "$GITHUB_ENV"
        uname -r
        if test -f /proc/version_signature; then cat /proc/version_signature; fi
        docker --host unix:///var/run/docker.sock version
        docker --host unix:///var/run/docker.sock buildx version
        docker --host unix:///var/run/docker.sock compose version
