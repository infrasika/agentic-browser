# Used with compose.yaml by scripts/public-demo.sh. Never share a team's volume.
name: ${AB_PROJECT_NAME:-agentic-browser-demo}
services:
  controller:
    environment:
      PUBLIC_URL: ${AB_PUBLIC_URL:-http://127.0.0.1:3334}
      BROWSER_AUTH_MODE: public
      BROWSER_NETWORK: public
      BROWSER_DATA_VOLUME: ${AB_PROJECT_NAME:-agentic-browser-demo}-data
      MAX_SESSIONS: ${AB_MAX_SESSIONS:-2}
      PUBLIC_MAX_SESSIONS_PER_IP: ${AB_MAX_SESSIONS_PER_IP:-2}
      BROWSER_TRUST_PROXY: ${AB_TRUST_PROXY:-false}
    # !override requires Docker Compose 2.24.4+; do not retain the team's port.
    ports: !override
      - "${AB_BIND_ADDRESS:-127.0.0.1}:${AB_PORT:-3334}:3333"
volumes:
  data:
    name: ${AB_PROJECT_NAME:-agentic-browser-demo}-data
