<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace sign-in · Agentic Browser</title><link rel="stylesheet" href="/app.css"><script type="module" src="/login.js"></script></head>
<body><header><a class="brand" href="/">a<span class="brand-dot">●</span> Agentic Browser</a></header>
<main class="dashboard"><h1>Sign in to your workspace.</h1><p class="intro">Use the username and password you configured when installing your workspace.</p>
<section class="panel"><form id="login-form">
<label for="username">Username</label><input id="username" autocomplete="username" required maxlength="64">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="256">
<button id="submit" class="primary">Sign in</button></form><p id="message" class="message" role="status"></p></section></main></body></html>
