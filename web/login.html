<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成员登录 · Agentic Browser</title><link rel="stylesheet" href="/app.css"><script type="module" src="/login.js"></script></head>
<body><header><a class="brand" href="/">a<span class="brand-dot">●</span> Agentic Browser</a></header>
<main class="dashboard"><h1>登录你的工作空间。</h1><p class="intro">使用部署管理员为你创建的成员账号。</p>
<section class="panel"><form id="login-form">
<label for="username">成员名</label><input id="username" autocomplete="username" required maxlength="64">
<label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="256">
<button id="submit" class="primary">登录</button></form><p id="message" class="message" role="status"></p></section></main></body></html>
