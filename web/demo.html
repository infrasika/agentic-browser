<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Handoff demo</title>
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/demo.js"></script>
  </head>
  <body class="demo-body">
    <main class="panel demo-card">
      <div class="eyebrow">HANDOFF DEMO</div>
      <h1 class="viewer-title">Welcome back.</h1>
      <p class="intro small">
        This is a local demo page. Use a fictional username and password to try signing in. Do not enter a real password.
      </p>
      <form id="login">
        <label for="username">Demo username</label
        ><input
          id="username"
          name="username"
          autocomplete="off"
          required
        /><label for="password">Demo password</label
        ><input
          id="password"
          name="password"
          type="password"
          autocomplete="off"
          required
        /><button class="primary wide">Sign in to the demo</button>
      </form>
      <section id="account" hidden>
        <h2 id="welcome"></h2>
        <p>Your demo session is signed in. You can now hand control back to the Agent.</p>
        <button id="continue" class="primary wide">Continue task</button>
        <p id="result" role="status"></p>
      </section>
    </main>
  </body>
</html>
